# Local development with Docker Compose
# Run: docker compose up --build

version: '3.9'

services:
  app:
    build: .
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: collab_workspace
      DB_USER: collabuser
      DB_PASS: collabpass
      APP_URL: http://localhost:8080
      APP_ENV: local
    volumes:
      - ./uploads:/var/www/html/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: collab_workspace
      MYSQL_USER: collabuser
      MYSQL_PASSWORD: collabpass
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    restart: unless-stopped

volumes:
  db_data:
