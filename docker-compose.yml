# Local development with Docker Compose
# Run: docker compose up --build

version: '3.9'

services:
  app:
    build: .
    ports:
      - "8080:80"
    environment:
      DB_DRIVER: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: collab_workspace
      DB_USER: collabuser
      DB_PASS: collabpass
      APP_URL: http://localhost:8080
      APP_ENV: local
    volumes:
      - ./uploads:/var/www/html/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: collab_workspace
      POSTGRES_USER: collabuser
      POSTGRES_PASSWORD: collabpass
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collabuser -d collab_workspace"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  db_data:
